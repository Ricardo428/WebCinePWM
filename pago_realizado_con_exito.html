<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Compra Exitosa - CineMax</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/layout.css">
  <script src="xLuIncludeFile.js"></script>
</head>
<body>
<header xlu-include-file="header.html"></header>
<div class="container">
  <main class="contenedor-exito">

    <div class="exito-header">
      <div class="caja-gris caja-titulo">
        <h2>¡PAGO REALIZADO CON ÉXITO!</h2>
      </div>
      <span class="icono-check">✔</span>
    </div>

    <div class="caja-gris caja-saludo">
      <p>¡Disfruta de la película Pepe!</p>
    </div>

    <div class="caja-gris caja-info-correo">
      <p>Hemos enviado un correo de confirmación a pepe@gmail.com con el resumen de tu compra y tus entradas.</p>
    </div>

    <section class="ticket-pelicula">
      <img src="https://via.placeholder.com/150x220/1e1e1e/ffffff?text=Avatar" alt="Póster Avatar" class="ticket-poster">

      <div class="ticket-info-der">
        <div class="caja-gris texto-pelicula">
          <p>Avatar: Fuego y Ceniza</p>
          <p>Screen & Eat Las Palmas - Sala 1</p>
          <p>Viernes 6 Oct - 20:00</p>
        </div>

        <div class="caja-gris texto-butacas">
          <p>BUTACAS: Fila H - 04, 05</p>
        </div>
      </div>
    </section>

    <section class="ticket-inferior">
      <div class="caja-gris caja-total">
        <p>TOTAL: 20,00€</p>
      </div>

      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg" alt="Código QR Ticket" class="ticket-qr">
    </section>

    <nav class="exito-botones">
      <button class="btn-gris">DESCARGAR TICKET</button>
      <a href="index.html" class="btn-gris">VOLVER</a>
    </nav>

  </main>

</div>
<script>

  xLuIncludeFile();

</script>
</body>
</html>
