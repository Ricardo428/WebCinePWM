<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.85">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="Js/main.js"></script>
</head>
<body>
<header xlu-include-file="templates/header.html"></header>
<div xlu-include-file="templates/carrusel.html"></div>
<div class="container">
  <main>
    <fieldset>
      <legend>Registro</legend>
      <form action="index.html" method="post">
        <div>
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div>
          <label for="surname">Apellido</label>
          <input type="text" id="surname" name="surname" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input type="password"
                 id="password"
                 name="password"
                 pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}"
                 title="Debe tener 8 caracteres e incluir una mayuscula, una minuscula, un número y un caracter especial."
                 required minlength="8">
        </div>

        <div>
          <label for="birthday">Fecha de nacimiento</label>
          <input type="date" id="birthday" name="birthday" required>
        </div>

        <button type="submit">Registrar</button>

      </form>
    </fieldset>

  </main>
</div>
<footer xlu-include-file="templates/footer.html"></footer>


<script src="Js/registro.js"></script>
<script src="Js/header.js"></script>
</body>
</html>
