<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="Js/xLuIncludeFile.js"></script>
</head>
<style>
  button[type="submit"],
  .btn-add {
    width: 100%;
    padding: 12px;
    background-color: var(--color-primario);
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
    margin-top: 10px;
  }

  button[type="submit"]:hover,
  .btn-add:hover {
    background-color: var(--color-primario-hover);
  }
</style>
<body>
<header xlu-include-file="templates/header.html"></header>
<div xlu-include-file="templates/carrusel.html"></div>
<div class="container">
  <main>
    <fieldset>
      <legend>Registro</legend>
      <form action="index.html" method="post">
        <div>
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div>
          <label for="surname">Apellido</label>
          <input type="text" id="surname" name="surname" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="8">
        </div>

        <div>
          <label for="birthday">Fecha de nacimiento</label>
          <input type="date" id="birthday" name="birthday" required>
        </div>


        <button type="submit" style="">Registrar</button>

      </form>
    </fieldset>

  </main>
</div>
<footer xlu-include-file="templates/footer.html"></footer>

<script>
  xLuIncludeFile();

  document.addEventListener('DOMContentLoaded', function() {
    const formRegistro = document.querySelector('form');

    if (formRegistro) {
      formRegistro.addEventListener('submit', function(event) {
        // Evitamos que el formulario salte de página por defecto
        event.preventDefault();

        // Capturamos los datos que el usuario ha escrito
        const nombre = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // 1. Recuperamos la lista de usuarios nuevos (si no existe, creamos un array vacío)
        let usuariosRegistrados = JSON.parse(localStorage.getItem('usuariosNuevos')) || [];

        // 2. Comprobamos si el correo ya fue registrado antes
        const existeUsuario = usuariosRegistrados.find(user => user.email === email);

        if (existeUsuario) {
          alert('Este correo electrónico ya está registrado. Por favor, usa otro o inicia sesión.');
          return; // Detenemos la ejecución
        }

        // 3. Creamos el objeto del nuevo usuario
        const nuevoUsuario = {
          email: email,
          password: password,
          nombre: nombre
        };

        // 4. Lo añadimos a la lista y lo guardamos en el navegador
        usuariosRegistrados.push(nuevoUsuario);
        localStorage.setItem('usuariosNuevos', JSON.stringify(usuariosRegistrados));

        // 5. Iniciamos sesión automáticamente para mejorar la experiencia
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('nombreUsuario', nombre);
        localStorage.setItem('emailUsuario', email); // (O la variable donde tengas el email)

        alert('¡Registro completado con éxito!');

        // Redirigimos a la página principal
        window.location.href = 'index.html';
      });
    }
  });
</script>
</body>
</html>
