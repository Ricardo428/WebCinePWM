<!DOCTYPE html>
<html lang="es">
<head>
    <title>CINE'S QUEVEDO</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="web-inicio-sesión.css">
</head>
<body>

    <header class="header-gris">
        <div class="circulo_logo">
            <img src="CinesO.png" alt="Logo">
        </div>
        <button class="btn-sesion">Iniciar Sesión</button>
        <button class="buscador-principal">Buscador</button>
        
        <nav class="nav-superior">
            <button class="btn-negro-amarillo">Cartelera</button>
            <button class="btn-negro-amarillo">Zona Socio</button>
            <button class="btn-negro-amarillo">Para ti</button>
            <button class="btn-negro-amarillo">Perfil</button>
        </nav>
    </header>

    <script>
        // Tu "base de datos" de películas
        const peliculas = [
            { titulo: "The Batman", imagen: "ba" },
            { titulo: "Superman", imagen: "superman.png" },
            { titulo: "Spider-man", imagen: "spiderman.png" }
        ];

        let indice = 0;

        function avanzar() {
            indice++;
            if (indice >= peliculas.length) indice = 0; // Reinicia si llega al final

            document.getElementById("titulo-peli").innerHTML = peliculas[indice].titulo;
            document.getElementById("imagen-peli").src = peliculas[indice].imagen;
        }
    </script>

    <div class="flecha-banner flecha-izq" onclick="retroceder()">&larr;</div>
    <div class="flecha-banner flecha-der" onclick="avanzar()">&rarr;</div>

    <div class="banner-container">
        <div class="flecha-banner flecha-izq">&larr;</div>
        <img src="batamn-poster.png" class="banner-img" alt="Batman Poster">
        <div class="flecha-banner flecha-der">&rarr;</div>
    </div>

    <div class="barra-filtros">
        <button class="btn-negro-amarillo">Cartelera</button>
        <button class="btn-negro-amarillo">Proximamente</button>
        <button class="btn-negro-amarillo margin-auto">Filtros</button>
    </div>

    <div class="contenedor-peliculas">
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
        <div class="card-pelicula">HOLA</div>
    </div>

    <footer class="footer-azul">
        <div class="fila-redes">
            <button class="btn-red-social"><img src="logo-twitter.png" alt="Twitter"></button>
            <button class="btn-red-social"><img src="logo-facebook.png" alt="Facebook"></button>
            <button class="btn-red-social"><img src="logo-youtube.png" alt="Youtube"></button>
            <button class="btn-red-social"><img src="logo-instagram.png" alt="Instagram"></button>
        </div>
        
        <div class="fila-legal">
            <button class="btn-negro-amarillo">Aviso Legal</button>
            <button class="btn-negro-amarillo">Privacidad</button>
            <button class="btn-negro-amarillo">Contacto</button>
        </div>
    </footer>

</body>
</html>
