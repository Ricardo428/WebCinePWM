<!DOCTYPE html>
<html lang="es">
<head>
    <title>SREEN & EAT</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/layout.css">

    <script src="Js/xLuIncludeFile.js"></script>
</head>

<body>
<header xlu-include-file="templates/header.html"></header>
<div xlu-include-file="templates/carrusel.html"></div>
<main class="contenido-principal">

    <div class="barra-filtros">
        <button class="btn-negro-amarillo">Cartelera</button>
        <button class="btn-negro-amarillo">Proximamente</button>
        <button class="btn-negro-amarillo margin-auto">Filtros</button>
    </div>

    <div class="contenedor-peliculas" id="cartelera">
        <template id="template-cartelera">
            <a class="card-pelicula">
                <img class="card-pelicula">
            </a>
        </template>
    </div>

</main>

<footer xlu-include-file="templates/footer.html"></footer>

<script>

    xLuIncludeFile();

    async function cartelera() {
        fetch("Json/datos.json")
            .then((res) => {
                return res.json()
            })
            .then((datos) => {
                if ('content' in document.createElement('template')) {
                    const contenedor = document.querySelector("#cartelera")

                    datos.peliculas.forEach(pelicula => {
                        const tarjet = document
                            .getElementById("template-cartelera")
                            .content.cloneNode(true);

                        tarjet.querySelector("a").href = `InfoFilm.html?id=${pelicula.id}`;
                        tarjet.querySelector("img").src = pelicula.imagen;

                        contenedor.appendChild(tarjet);
                    })
                } else {
                    console.error("No se encontro la cartelera")
                }
            })
            .catch((error) => console.log(error))
    }

    document.addEventListener("DOMContentLoaded", cartelera);

</script>
</body>
</html>
