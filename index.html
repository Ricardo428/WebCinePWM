<!DOCTYPE html>
<html lang="es">
<head>
    <title>SREEN & EAT</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/layout.css">

    <script src="xLuIncludeFile.js"></script>
</head>

<body>
<header xlu-include-file="header.html"></header>
<div xlu-include-file="carrusel.html"></div>
<main class="contenido-principal">

    <div class="barra-filtros">
        <button class="btn-negro-amarillo">Cartelera</button>
        <button class="btn-negro-amarillo">Proximamente</button>
        <button class="btn-negro-amarillo margin-auto">Filtros</button>
    </div>

    <div class="contenedor-peliculas"  id="cartelera">
    </div>

</main>

<footer xlu-include-file="/footer.html"></footer>

<script>

    xLuIncludeFile();

    async function cartelera() {
        try{
            const datos = await fetch("/datos.json").then(res => res.json())
            const contenedor = document.querySelector("#cartelera")

            datos.peliculas.forEach(pelicula => {
                const tarjet = `
                    <a href="${pelicula.url}" class="card-pelicula">
                        <img src="${pelicula.imagen}" class="card-pelicula-image">
                    </a>

                `;
                contenedor.innerHTML += tarjet;
            })
        }catch(error){
            console.error("Hubo un error cargando las películas:", error);
        }

    }
    document.addEventListener("DOMContentLoaded", cartelera);

</script>
</body>
</html>
