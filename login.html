<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="Js/xLuIncludeFile.js"></script>
</head>
<style>
    button[type="submit"],
    .btn-add {
        width: 100%;
        padding: 12px;
        background-color: var(--color-primario);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: 10px;
    }

    button[type="submit"]:hover,
    .btn-add:hover {
        background-color: var(--color-primario-hover);
    }
</style>
<body>
<header xlu-include-file="templates/header.html"></header>
<header xlu-include-file="templates/carrusel.html"></header>

<div class="container">
    <main>
        <fieldset >
            <legend>Log in</legend>

            <form action="index.html" method="post">
                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required autocomplete="email">
                </div>

                <div>
                    <label for ="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="" required autocomplete="current-password" minlength="8">
                </div>

                <div>
                    <a href="https://www.google.com/">¿Has olvidado la contraseña?</a>
                </div>

                <div>
                    <a href="registro.html">No tengo cuenta</a>
                </div>

                <div>
                    <button type="submit">Entrar</button>
                </div>

                <div>
                    <input type="checkbox" id="captcha-check" required>
                    <label for="captcha-check">No soy un robot</label>
                </div>

            </form>
        </fieldset>

    </main>

</div>
<footer xlu-include-file="templates/footer.html"></footer>

<script>
    xLuIncludeFile();

    document.addEventListener('DOMContentLoaded', function() {
        const formLogin = document.querySelector('form');

        if (formLogin) {
            formLogin.addEventListener('submit', async function(event) {
                event.preventDefault();

                const emailIngresado = document.getElementById('email').value;
                const passwordIngresado = document.getElementById('password').value;
                localStorage.setItem('emailUsuario', emailIngresado); // (O la variable donde tengas el email)

                try {
                    // 1. Leemos los usuarios estáticos del JSON
                    const respuesta = await fetch('users.json');
                    const usuariosBase = await respuesta.json();

                    // 2. Leemos los usuarios nuevos registrados desde el navegador
                    const usuariosNuevos = JSON.parse(localStorage.getItem('usuariosNuevos')) || [];

                    // 3. Juntamos ambas listas en una sola
                    const todosLosUsuarios = usuariosBase.concat(usuariosNuevos);

                    // 4. Buscamos si existe coincidencia
                    const usuarioValido = todosLosUsuarios.find(
                        user => user.email === emailIngresado && user.password === passwordIngresado
                    );

                    if (usuarioValido) {
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('nombreUsuario', usuarioValido.nombre);

                        window.location.href = 'index.html';
                    } else {
                        alert('Email o contraseña incorrectos. Por favor, revisa tus datos.');
                    }

                } catch (error) {
                    console.error('Error al iniciar sesión:', error);
                    alert('Hubo un problema al conectar con la base de datos.');
                }
            });
        }
    });
</script>
</body>
</html>
