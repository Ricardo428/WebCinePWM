<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">

    <script src="Js/xLuIncludeFile.js"></script>
    <script src="Js/carrusel.js"></script>
</head>
<body>
<header xlu-include-file="templates/header.html"></header>
<header xlu-include-file="templates/carrusel.html"></header>
  <div class="container">
    <main>
      <section class="perfil-contenedor">

        <header class="perfil-etiqueta">
          <h2>Perfil</h2>
        </header>

        <div class="perfil-datos">
          <ul class="lista-datos">
            <li>
              <span class="dato-label">Email:</span>
              <span class="dato-valor">pepe@gmail.com</span>
            </li>

            <li>
              <span class="dato-label">Contraseña:</span>
              <span class="dato-valor">*******</span>
            </li>
            <li>
              <span class="dato-label">Puntos:</span>
              <span class="dato-valor texto-destacado">2000</span>
            </li>
          </ul>

          <div class="perfil-acciones">
            <a href="historial_peliculas.html" class="btn-perfil btn-primario">Historial de Compras</a>
            <a href="resumen_preferencias.html" class="btn-perfil btn-secundario">Mis Preferencias</a>
          </div>

        </div>
      </section>
    </main>

  </div>
<footer xlu-include-file="templates/footer.html"></footer>

<script>

  xLuIncludeFile();

    document.addEventListener('DOMContentLoaded', function() {
    // 1. Proteger la página: si no ha iniciado sesión, lo mandamos al login
    if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
    return;
  }

    // 2. Pintar los datos del usuario
    const nombre = localStorage.getItem('nombreUsuario') || 'Usuario Invitado';
    const email = localStorage.getItem('emailUsuario') || 'Sin correo registrado';

    document.getElementById('perfil-nombre-display').textContent = nombre;
    document.getElementById('perfil-email-display').textContent = email;

    // 3. Revisar si existen preferencias elegidas
    const preferenciasContainer = document.getElementById('preferencias-container');
    const preferenciasGuardadas = localStorage.getItem('preferenciasUsuario');
    let arrayPreferencias = [];

    if (preferenciasGuardadas) {
    arrayPreferencias = JSON.parse(preferenciasGuardadas);
  }

    // 4. Mostrar preferencias o dejarlas vacías
    if (arrayPreferencias.length === 0) {
    preferenciasContainer.innerHTML = '<p style="grid-column: 1 / -1; color: #888; font-style: italic;">Aún no has seleccionado ninguna preferencia.</p>';
  } else {
    preferenciasContainer.innerHTML = ''; // Limpiamos
    arrayPreferencias.forEach(function(pref) {
    const span = document.createElement('span');
    span.className = 'etiqueta-pref';
    span.textContent = pref;
    preferenciasContainer.appendChild(span);
  });
  }
  });

</script>
</body>
</html>
