<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCREEN&EAT</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="xLuIncludeFile.js"></script>
    <style>

        #ContenidoPrincipal{
            display: flex;
            max-width: 65rem;
            justify-content: center;
            align-items: flex-start;
            margin: 5rem auto;
            padding: 1rem;
        }

        .resumen-pago{
            flex: 1;
            background-color: #e0e0e0;
            padding: 3rem;
            border-radius: 0.5rem;
        }


        .resumen-pago h3 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid #ccc;
            padding-bottom: 1rem;
            color: #444;
        }

        .resumen-pago ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .resumen-pago ul li{
            list-style: none;
            padding: 0.8rem 0;
            display: flex;
            justify-content: space-between;
        }

        .cuadro-pago{
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: gray;
            width: 45rem;
            margin-left: 2rem;
            border-radius: 0.5rem;
        }

        .cuadro-pago input {
            width: 100%;
            font-size: 1.2rem;
            padding: 1rem;
            border: none;
            border-radius: 0.25rem;
        }


        .Numero{
            width: 100%;
            margin-top: 2rem;

        }

        .CA-CV{
            display: flex;
            width: 100%;
        }

        .labels {
            display: flex;
            flex-direction: column;
            margin: 1.5rem;
        }


    </style>
</head>
<body class="paso-5">
<header xlu-include-file="header.html"></header>
<div xlu-include-file="Pasos.html"></div>
<div class="contador-header">
    <span>Tiempo de reserva</span>
    <strong>19:08</strong>
</div>
<main id="ContenidoPrincipal">

    <div class="resumen-pago">
        <h3>Datos de la operacion</h3>
        <ul>
            <li><strong>IMPORTE:</strong> 12$</li>
            <li><strong>Comercio:</strong> Yelmo Cines</li>
            <li><strong>Terminal:</strong> 34345677</li>
            <li><strong>Pedido:</strong> 212343</li>
            <li><strong>Fecha:</strong> 23/02/2026</li>
            <li><strong>Descripción:</strong> Entradas Torrente</li>
        </ul>

    </div>

    <div class="cuadro-pago">
        <div class="Numero">
            <label class="labels">
                <input type="text" placeholder="Número de tarjeta">
            </label>
        </div>

        <div class="CA-CV">
            <label class="labels">
                <input type="text" placeholder="Caducidad">
            </label>

            <label class="labels">

                <input type="text" placeholder="CVV">
            </label>
        </div>


        <div class="perfil-acciones">
            <a href="InfoFilm.html" class="btn-perfil btn-primario">Volver</a>
            <a href="/pago_realizado_con_exito.html" class="btn-perfil btn-secundario">Siguiente</a>
        </div>

    </div>



</main>

    xLuIncludeFile();

</script>

</html>
