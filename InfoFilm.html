<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Película - SCREEN & EAT</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/estilos.css">

    <script type="module" src="Js/main.js" defer></script>
    <script src="Js/datosPelicula.js" defer></script>

</head>
<body>

<header xlu-include-file="templates/header.html"></header>
<div class="container">
<main class="contenedor-pelicula">

    <h1 class="titulo-pelicula"></h1>

    <div class="pelicula-grid">

        <div class="pelicula-poster">
            <img class="imagenes" alt="Póster de la película">
            <a href="#" id="trailer" class="btn-trailer">Ver Tráiler</a>
        </div>

        <div class="pelicula-datos">

            <p class="pelicula-sinopsis"></p>

            <div class="horarios-contenedor">
                <ul class="lista-info">
                    <li><strong>Duración:</strong> <span id="info-duracion"></span></li>
                    <li><strong>Reparto:</strong> <span id="info-reparto"></span></li>
                    <li><strong>Género:</strong> <span id="info-genero"></span></li>
                    <li><strong>Calificación:</strong> <span id="info-clasificacion"></span></li>
                </ul>
            </div>

            <div class="horarios-contenedor">
                <h3>Selecciona una sesión:</h3>
                <ul class="lista-horarios">
                </ul>
            </div>

        </div>



    </div>



</main>
</div>
<footer xlu-include-file="templates/footer.html"></footer>

</body>
<script src="Js/header.js"></script>
</html>
