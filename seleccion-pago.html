<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/seleccion-pago.css">
    <title>Document</title>
</head>
<body>
<header class="header-gris">
    <div class="circulo_logo">
        <img src="CinesO.png" alt="Logo">
    </div>
    <button class="btn-sesion">Iniciar Sesión</button>
    <button class="buscador-principal">Buscador</button>

    <nav class="nav-superior">
        <button class="btn-negro-amarillo">Cartelera</button>
        <button class="btn-negro-amarillo">Zona Socio</button>
        <button class="btn-negro-amarillo">Para ti</button>
        <button class="btn-negro-amarillo">Perfil</button>
    </nav>
</header>

<div class="stepper-container">
    <div class="stepper-line"></div>
    <div class="step">
        <div class="step-circle"></div>
        <div class="step-text"><span>Paso 1:</span> Butacas</div>
    </div>
    <div class="step">
        <div class="step-circle"></div>
        <div class="step-text"><span>Paso 2:</span> Entradas</div>
    </div>
    <div class="step">
        <div class="step-circle"></div>
        <div class="step-text"><span>Paso 3:</span> Comida</div>
    </div>
    <div class="step">
        <div class="step-circle"></div>
        <div class="step-text"><span>Paso 4:</span> Resumen</div>
    </div>
    <div class="step">
        <div class="step-circle active"></div>
        <div class="step-text"><span>Paso 5:</span> Pago</div>
    </div>
</div>

<div class="contador-header">
    <span>Tiempo de reserva</span>
    <strong>19:08</strong>
</div>

<div class="cuadrado-metodo"><b>Seleccione el método de pago</b></div>
<div class="rectangulo-opciones">
    <div class="cuadrado-opcion">
        <div class="cuadrado-logo">
            <img src="logo bizum.png" alt="">
        </div>
        <div class="informacion-opcion"><b>Bizum</b></div>
    </div>
    <div class="cuadrado-opcion">
        <div class="cuadrado-logo">
            <img src="PayPal-Logo-Transparent.png" alt="">
        </div>
        <div class="informacion-opcion"><b>Paypal</b></div>
    </div>
    <div class="cuadrado-opcion">
        <div class="cuadrado-logo">
            <img src="logo tarjeta credito.png" alt="">
        </div>
        <div class="informacion-opcion"><b>Tarjeta de Crédito</b></div>
    </div>
</div>

<div class="botones">
    <a href="canjear-puntos.html">
        <button>Volver</button>
    </a>
    <button>Siguiente</button>
</div>
</body>
</html>
