<!DOCTYPE html>
<html lang="es">

<div class="contador-header">
  <span>Tiempo de reserva</span>

</div>

<div class="container">
  <main class="contenedor-bizum">

    <aside class="columna-temporizador">
      <span class="temporizador-etiqueta">Tiempo de reserva</span>
      <div class="temporizador-tiempo">18:56</div>
    </aside>

    <section class="columna-formulario">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Bizum.svg" alt="Bizum" class="logo-bizum">

      <form action="pago_realizado_con_exito.html" method="POST" class="form-bizum">

        <div class="grupo-form-bizum">
          <label>Teléfono registrado en Bizum</label>
          <input type="text" class="input-bizum" disabled>
        </div>

        <div class="grupo-form-bizum">
          <label>Introduce número de teléfono</label>
          <div class="input-con-icono">
            <input type="tel" class="input-bizum" required>
          </div>
        </div>

        <button type="submit" class="btn-continuar-compra">Continuar la compra</button>
      </form>
    </section>

  </main>
