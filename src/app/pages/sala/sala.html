<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Selección de Butacas</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
<div class="paso-1">
  <app-barra-pasos></app-barra-pasos>
  <app-temporizador></app-temporizador>

  <div class="container">
    <main class="contenedor-sala">
      <h1 class="titulo-sala">Selecciona tus butacas</h1>

      <div class="controles-zoom">
        <button type="button" (click)="zoomIn()">+</button>
        <button type="button" (click)="resetZoom()">↺</button>
        <button type="button" (click)="zoomOut()">-</button>
      </div>

      <div class="contenedor-panzoom" #contenedorPanzoom>
        <div class="lienzo-butacas" #lienzoButacas>
          <div class="pantalla">PANTALLA</div>

          <div class="grid-asientos">
            @for (b of butacas(); track b.id) {
              <div
                class="asiento"
                [ngClass]="[b.estado, b.tipo]"
                (click)="seleccionarButaca(b)">
              </div>
            }
          </div>
        </div>
      </div>

      <div class="leyenda-butacas">
        <div class="leyenda-item"><div class="muestra normal libre"></div> Libre</div>
        <div class="leyenda-item"><div class="muestra normal ocupada"></div> Ocupada</div>
        <div class="leyenda-item"><div class="muestra normal seleccionada"></div> Tu selección</div>
        <div class="leyenda-item"><div class="muestra silla-ruedas libre"></div> Silla ruedas</div>
        <div class="leyenda-item"><div class="muestra silla-ruedas ocupada"></div> Silla (Ocupada)</div>
      </div>

      <p>Butacas seleccionadas: <strong>{{ seleccionadasCount() }}</strong></p>

      <div class="perfil-acciones acciones-sala">
        <button (click)="continuar()" class="btn-perfil btn-primario" style="width: 100%;">Siguiente</button>
      </div>
    </main>
  </div>
</div>
</ion-content>
