<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Historial de Compras</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
<div class="container">
  <main>
    <section class="historial-contenedor">

      <header class="titulo-seccion">
        <h1>Historial de Compras</h1>
        <p>Tus últimas adquisiciones en Screen & Eat.</p>
      </header>

      <ul class="lista-compras">
        @for (compra of compras; track compra.id){
          <li class="compra-card">
            <img [src]="compra.pelicula.imagen" alt="Póster Película 1" class="compra-poster">

            <div class="compra-info">
              <div class="info-cabecera">
                <h3 class="compra-titulo">{{compra.pelicula.titulo}}</h3>

              </div>

              <div class="compra-detalles">
                <p class="detalle-linea">
                  <strong>Fecha:</strong> {{ compra?.fecha }}
                </p>
                <p class="detalle-linea">
                  <strong>Hora:</strong>{{ compra?.hora }}
                </p>
                <p class="detalle-linea ">
                  <strong>Total:</strong> {{compra?.totalCompra}} €
                </p>
              </div>
            </div>
          </li>
        }
      </ul>



    </section>
  </main>
</div>
</ion-content>
