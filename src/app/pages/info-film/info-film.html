<ion-content>
<div class="container">
  <main class="contenedor-pelicula">

    <h1>{{pelicula?.titulo}}</h1>

    <div class="pelicula-grid">

      <div class="pelicula-poster">
        <img [src]="pelicula.imagen" class="imagenes" [alt]="pelicula.titulo">
        <a [href]="pelicula.trailer" id="trailer" class="btn-trailer">Ver Tráiler</a>
      </div>

      <div class="pelicula-datos">

        <p class="pelicula-sinopsis">{{pelicula.sinopsis}}</p>

        <div class="horarios-contenedor">
          <ul class="lista-info">
            <li><strong>Duración:</strong> <span id="info-duracion">{{pelicula.duracion}}</span></li>
            <li><strong>Reparto:</strong> <span id="info-reparto">{{pelicula.reparto}}</span></li>
            <li><strong>Género:</strong> <span id="info-genero">{{pelicula.genero}}</span></li>
            <li><strong>Calificación:</strong> <span id="info-clasificacion">{{pelicula.clasificacion}}</span></li>
          </ul>
        </div>

        <div class="horarios-contenedor">
          <h3>Selecciona una sesión:</h3>
          <ul class="lista-horarios">
            @for (hora of pelicula.horarios; track hora){
              <li>
                <button (click)="seleccionarSesion(hora, pelicula.id)" class="btn-hora">
                  {{hora}}
                </button>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </main>
</div>
<app-footer></app-footer>

<!-- Botón flotante de favorito (SQLite) -->
<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button (click)="toggleFavorito()"
                  [color]="isFavorito ? 'danger' : 'medium'"
                  id="btn-favorito-detalle">
    <ion-icon [name]="isFavorito ? 'heart' : 'heart-outline'"></ion-icon>
  </ion-fab-button>
</ion-fab>

</ion-content>
