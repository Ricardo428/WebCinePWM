<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/estilos.css">
  <style>

    body{
      font-family: Arial, Helvetica, sans-serif, Helvetica, sans-serif;
      background-color: lightgray;
    }

    #container {
      min-width: 20rem;
      max-width: 44rem;
      margin: 0 auto;
      padding: 2rem;
    }

    #butacas{
      width: 100%;

    }

    #butacas table{
      border: black 0.1rem solid;
      width: 100%;
    }

    .botones{
      font-weight: bold;
      text-align: center;
      padding: 0.5rem;
      margin: 1rem;
      justify-content: center;
    }

    .botones button{
      font-size: 1.5rem;
      font-weight: bold;
      background-color: lightgray;
      padding: 0.5rem 1rem;
      border-radius: 0.7rem;
    }

    .botones button:hover{
      background-color: #f2f2f2;
    }

    #imagen{
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    #imagen img{
      max-width: 100%;
      height: auto;
    }

  </style>
</head>
<body>

<div id="container">
  <div id="imagen">
    <img src="img/butacas.png" alt="BUTCASAAAAAAAAAA">
  </div>
  <div id="butacas">
    <table>
      <tbody>
      <tr>
        <td><img src="https://tickets.ocinepremium7palmas.es/compra/imagesv2/am.jpg" alt="BUTACA LIBRE"></td>
        <td><p>BUTACA LIBRE</p></td>
        <td><img src="https://tickets.ocinepremium7palmas.es/compra/imagesv2/amocupat.jpg" alt="BUTACA OCUPADA"></td>
        <td><p>BUTACA OCUPADA</p></td>
      </tr>
      <tr>
        <td><img src="https://tickets.ocinepremium7palmas.es/compra/imagesv2/minus.jpg" alt="ESPACIO SILLA RUEDAS LIBRE"></td>
        <td><p>ESPACIO SILLA RUEDAS LIBRE</p></td>
        <td><img src="https://tickets.ocinepremium7palmas.es/compra/imagesv2/minusocupat.jpg" alt="ESPACIO SILLA RUEDAS OCUPADO"></td>
        <td><p>ESPACIO SILLA RUEDAS OCUPADO</p></td>
      </tr>
      </tbody>
    </table>
  </div>




  <div class="botones">
    <button>Volver</button>
    <button>Siguiente</button>
  </div>

</div>

</body>
</html>
